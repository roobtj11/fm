name: Build branch preview

on:
  push:
    branches:
      - codex/build-optimizer-rework
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: branch-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Forge Master
        run: npm run build

      - name: Package preview
        uses: actions/upload-artifact@v4
        with:
          name: forge-master-preview
          path: ./dist
          if-no-files-found: error
